name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run portable checks
        run: make check
      - name: Generate progress report
        run: python3 tools/progress_report.py
      - name: Upload progress report
        uses: actions/upload-artifact@v7
        with:
          name: SLUS_01044_report
          path: build/us/report.json
      - name: Publish progress to decmp.dev
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: TheGh0stShip/upload-action@82dad316c7d61166013158c0b34abb910ab89e40
        with:
          report: build/us/report.json
          version: SLUS_01044
          name: "BattleTanx: Global Assault"
          platform: ps
