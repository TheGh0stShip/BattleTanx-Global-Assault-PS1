name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run portable checks
        run: make check
      - name: Generate progress report
        run: python3 tools/progress_report.py
      - name: Upload progress report
        uses: actions/upload-artifact@v4
        with:
          name: SLUS_01044_report
          path: build/us/report.json
